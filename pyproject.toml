# Project metadata and tool configuration.
#
# This repository is a collection of training scripts, not an
# installable package: there is deliberately no [build-system] section.
# Flake8 configuration stays in .flake8 (flake8 does not read this file).

[project]
name = "deep-learning-foundations"
version = "0.1.0"
description = "Deep-learning fundamentals: multi-backbone CIFAR-10 training (TensorFlow / Keras 3)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# Bare pytest runs the transformer-pt-en suite from the repository root;
# pytest inserts transformer-pt-en/tests into sys.path, and conftest.py
# there adds the flat train/ and data_prep/ script dirs its imports rely
# on. The suite needs xxhash (data_prep/requirements.txt); without it
# those tests are skipped, not failed.
#
# The cifar10 suites are NOT listed: their flat train/inference dirs
# share module names (config, model, utils, dataset, scheduler, ...) with
# transformer-pt-en/train, so collecting them in the same pytest process
# resolves the wrong modules. Run each from its own directory instead
# (python -m pytest -q inside cifar10/train and cifar10/inference), as
# the CI workflow does.
testpaths = ["transformer-pt-en/tests"]
