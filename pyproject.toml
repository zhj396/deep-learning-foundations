# Project metadata and tool configuration.
#
# This repository is a collection of training scripts, not an
# installable package: there is deliberately no [build-system] section.
# Flake8 configuration stays in .flake8 (flake8 does not read this file).

[project]
name = "deep-learning-foundations"
version = "0.1.0"
description = "Deep-learning fundamentals: multi-backbone CIFAR-10 training (TensorFlow / Keras 3)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# Run all suites from the repository root; pytest inserts each test
# directory into sys.path, which the flat module layouts' imports (from
# config import Config, ... in cifar10/train; from app import app, ...
# in cifar10/inference; from prep_config import ... in
# transformer-pt-en/data_prep) rely on. The transformer-pt-en/tests
# suite needs xxhash (data_prep/requirements.txt); without it those
# tests are skipped, not failed.
testpaths = ["cifar10/train", "cifar10/inference", "transformer-pt-en/tests"]
